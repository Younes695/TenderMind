# HTTPS in front of the app (used by deploy/oracle-setup.sh).
#   DOMAIN=... EMAIL=... docker compose -f docker-compose.yml -f deploy/docker-compose.https.yml up -d
services:
  app:
    ports: !reset []           # reachable only through Caddy on the compose network

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      EMAIL: ${EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
